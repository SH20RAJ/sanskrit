name: VS Code Extension Release

on:
  push:
    tags:
      - 'vscode-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Package and Publish Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd editors/vscode
          npm install

      - name: Verify TypeScript & Build
        run: |
          cd editors/vscode
          npm run lint
          npm run build

      - name: Package VSIX
        run: |
          cd editors/vscode
          npx @vscode/vsce package --no-git-tag-version --out ../../sanskrit-vscode.vsix

      - name: Generate Checksums
        run: |
          sha256sum sanskrit-vscode.vsix > sanskrit-vscode.vsix.sha256
          cat sanskrit-vscode.vsix.sha256

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        with:
          files: |
            sanskrit-vscode.vsix
            sanskrit-vscode.vsix.sha256
          draft: false
          prerelease: true
          generate_release_notes: true

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          cd editors/vscode
          npx @vscode/vsce publish -p $VSCE_PAT --packagePath ../../sanskrit-vscode.vsix

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          cd editors/vscode
          npx ovsx publish ../../sanskrit-vscode.vsix -p $OVSX_PAT
