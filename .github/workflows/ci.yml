name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run automated test suite
      run: npm test

    - name: Verify CLI binary help and version
      run: |
        ./bin/sanskrit --version
        ./bin/sanskrit --help

    - name: Validate package packing
      run: npm pack --dry-run

  installer-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Test standalone install.sh script
      run: |
        mkdir -p /tmp/ci-install/bin /tmp/ci-install/share
        ./install.sh --install-dir /tmp/ci-install/share/sanskrit --bin-dir /tmp/ci-install/bin
        /tmp/ci-install/bin/sanskrit --version
        /tmp/ci-install/bin/sanskrit run test/main.sns
        ./install.sh --install-dir /tmp/ci-install/share/sanskrit --bin-dir /tmp/ci-install/bin --uninstall
