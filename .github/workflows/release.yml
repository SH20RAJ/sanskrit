name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: sanskrit
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: sanskrit
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: sanskrit
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: sanskrit
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: sanskrit.exe

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build Binary
        run: cargo build --release -p sanskrit-cli --target ${{ matrix.target }}
      - name: Package Archive
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.artifact }} dist/
          cd dist
          tar -czf ../sanskrit-${{ github.ref_name }}-${{ matrix.target }}.tar.gz *
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanskrit-${{ matrix.target }}
          path: sanskrit-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Generate Checksums
        run: |
          sha256sum **/*.tar.gz > SHA256SUMS
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/*.tar.gz
            SHA256SUMS
          draft: false
          prerelease: false
